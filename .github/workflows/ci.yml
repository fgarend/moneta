# The checks of make check, one box per check, on every push to main and every pull request. A red box is repeated on
# the machine by the make target of the same name. The list must stay CHECKS of the Makefile, as
# test/workflows.test.ts checks.
# A push to main whose last commit starts with "chore: release v" also calls release.yml, once every box has passed.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Only pull requests cancel an earlier run. Each push has a group of its own, as a group also drops a run waiting in it,
# so a newer push never cuts a release.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # ARM, as the machines the screenshots will be approved on.
    runs-on: ubuntu-24.04-arm
    strategy:
      # A box that fails does not cancel the others, so every problem shows at once.
      fail-fast: false
      matrix:
        check: [lint, types, test, stories, package]
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run make ${{ matrix.check }}
        run: make ${{ matrix.check }}
      # The images a failing visual test writes, which exist nowhere else when a difference shows only here.
      - name: Keep the failing screenshots
        if: ${{ failure() && matrix.check == 'stories' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-attachments
          path: .vitest/attachments/
          if-no-files-found: ignore
          retention-days: 7
      # The tarball this box has just tested, so what is published is what passed.
      - name: Keep the tarball for the release
        if: "${{ matrix.check == 'package' && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore: release v') }}"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: .package/*.tgz
          if-no-files-found: error
          retention-days: 7

  release:
    needs: check
    if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore: release v') }}"
    # The most its jobs may ask for: each one asks only for what it needs.
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/release.yml
