# The checks of make check, one box per check, on every pull request: main takes only what passed here, as its rule
# requires the job checks. A red box is repeated on the machine by the make target of the same name. The lists must stay
# CHECKS of the Makefile, with stories in a job of its own, and everyBrowser of vitest.config.ts, as
# test/workflows.test.ts checks. release.yml publishes after the merge, and checks nothing again.
name: ci

on:
  pull_request:

permissions:
  contents: read

# A newer push to the pull request cancels the run before it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # ARM, as the machines the screenshots will be approved on.
    runs-on: ubuntu-24.04-arm
    strategy:
      # A box that fails does not cancel the others, so every problem shows at once.
      fail-fast: false
      matrix:
        check: [lint, types, test, package, storybook-build]
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run make ${{ matrix.check }}
        run: make ${{ matrix.check }}

  # The stories, one box per browser, so a red box names its browser, and re-running the failed jobs repeats only it.
  stories:
    # ARM, as the machines the screenshots will be approved on.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run make stories BROWSER=${{ matrix.browser }}
        run: make stories BROWSER=${{ matrix.browser }}
      # The images a failing visual test writes, which exist nowhere else when a difference shows only here.
      - name: Keep the failing screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-attachments-${{ matrix.browser }}
          path: .vitest/attachments/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # A pull request whose package.json holds a version with no tag releases it once merged, so its number and changelog
  # are checked here, before the merge.
  version:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check a pending release (make check-release)
        run: |
          version=$(scripts/pending-version.sh)
          if [ -z "$version" ]; then
            echo "package.json's version is released: this pull request releases nothing."
          else
            make check-release VERSION="$version"
          fi

  # The one job main's rule requires. GitHub counts a skipped job as passed, so this one always runs and fails unless
  # every other job passed.
  checks:
    needs: [check, stories, version]
    if: ${{ always() }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Pass only when every box passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "A job ended as $result: $RESULTS"
              exit 1
            fi
          done
