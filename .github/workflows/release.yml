# A release, on every merge to main whose package.json holds a version with no tag yet: the release's own pull request,
# or the fix of one that failed before publishing. ci.yml checked the pull request, so nothing is checked again but the
# audit, as a vulnerability can appear with no change, and the package, built and tested here to be the one published.
# build runs the project's code and cannot write. publish and pages write, and run none of it. The tag is created by
# publish, so a failure before it spends no version. docs/releasing.md says what to do when a job fails.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

# One release at a time, never cancelled, so two merges never publish the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  pending:
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.pending.outputs.version }}
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the version still to publish, if any
        id: pending
        run: echo "version=$(scripts/pending-version.sh)" >> "$GITHUB_OUTPUT"

  build:
    needs: pending
    if: ${{ needs.pending.outputs.version != '' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse a release with a known vulnerability (make audit)
        run: make audit
      - name: Build and test the tarball to publish (make package)
        run: make package
      - name: Keep the tarball for the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: .package/*.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Build the gallery (make storybook-build)
        run: make storybook-build
      - name: Keep the gallery for Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: storybook-static/
      - name: Write the notes (make release-notes)
        env:
          VERSION: ${{ needs.pending.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/notes"
          make release-notes VERSION="$VERSION" > "$RUNNER_TEMP/notes/notes.md"
      - name: Keep the notes for the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: ${{ runner.temp }}/notes/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [pending, build]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Take the tarball built and tested above
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/
      - name: Take the notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: ${{ runner.temp }}/notes/
      # With a file, this creates a draft, uploads it and publishes, and only then do the tag and the release lock.
      - name: Publish the release, with its tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.pending.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes/notes.md" \
            "$RUNNER_TEMP/package/fgarend-moneta-$VERSION.tgz"

  pages:
    needs: publish
    runs-on: ubuntu-24.04-arm
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the gallery on Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
