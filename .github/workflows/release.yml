# A release, called by ci.yml on a release commit or in a run started by hand, in the same run, once every box has
# passed. verify and build run the project's code and cannot write. publish and pages write, and run none of it. The
# tag is created by publish, so a failed check spends no version. docs/releasing.md says what to do when a job fails.
name: release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A run started by hand has no commit message, so it takes the version package.json holds.
      - name: Read the version the commit names, or package.json in a run started by hand
        id: version
        env:
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            subject="package.json's version"
            version=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json)
          else
            subject=${MESSAGE%%$'\n'*}
            version=${subject#chore: release v}
          fi
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The commit names no version X.Y.Z: $subject"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Refuse a version with a tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" || status=$?
          if [ "$status" != 2 ]; then
            echo "v$VERSION already has a tag, or the tags could not be read (status $status)."
            exit 1
          fi
      - name: Refuse a version whose package.json or changelog is not ready (make check-release)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make check-release VERSION="$VERSION"
      - name: Refuse a release with a known vulnerability (make audit)
        run: make audit

  build:
    needs: verify
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the gallery (make storybook-build)
        run: make storybook-build
      - name: Keep the gallery for Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: storybook-static/
      - name: Write the notes (make release-notes)
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/notes"
          make release-notes VERSION="$VERSION" > "$RUNNER_TEMP/notes/notes.md"
      - name: Keep the notes for the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: ${{ runner.temp }}/notes/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [verify, build]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Take the tarball the package box tested
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/
      - name: Take the notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: ${{ runner.temp }}/notes/
      # With a file, this creates a draft, uploads it and publishes, and only then do the tag and the release lock.
      - name: Publish the release, with its tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes/notes.md" \
            "$RUNNER_TEMP/package/fgarend-moneta-$VERSION.tgz"

  pages:
    needs: publish
    runs-on: ubuntu-24.04-arm
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the gallery on Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
