# Where and how each command runs: the image, what is mounted, and whether the code can be written.
# The Makefile chooses the service; what runs is the command it passes. Values come from infra/settings.env.
name: moneta

x-build: &build
  context: ..
  dockerfile: infra/Dockerfile
  args:
    PLAYWRIGHT_IMAGE: ${PLAYWRIGHT_IMAGE:?set in infra/settings.env}
    PNPM_IMAGE: ${PNPM_IMAGE:?set in infra/settings.env}

services:
  # The tools, checking only: the code is read-only, over the dependencies of the image. The folder node_modules of the
  # machine is hidden, so the image's own is used. A failing visual test writes its images to .vitest, and
  # the coverage its report to coverage, the only folders they may write.
  tools:
    image: moneta:deps
    build: { <<: *build, target: deps }
    volumes:
      - ..:/app:ro
      - /app/node_modules
      - ../.vitest:/app/.vitest
      - ../coverage:/app/coverage

  # The same tools, building the package and installing it in a throwaway app: the code stays read-only, the build and the
  # tarball are the only folders they may write, and pnpm's store keeps what the app downloads.
  package:
    image: moneta:deps
    build: { <<: *build, target: deps }
    volumes:
      - ..:/app:ro
      - /app/node_modules
      - ../dist:/app/dist
      - ../.package:/app/.package
      - pnpm-store:/pnpm-store

  # The same tools, building the gallery: the code stays read-only, and the site is the only folder it may write.
  gallery:
    image: moneta:deps
    build: { <<: *build, target: deps }
    volumes:
      - ..:/app:ro
      - /app/node_modules
      - ../storybook-static:/app/storybook-static

  # The same tools, writing the code: make format and make update-screenshots.
  tools-write:
    image: moneta:deps
    build: { <<: *build, target: deps }
    volumes:
      - ..:/app
      - /app/node_modules

  # Serves the gallery of stories, with a port of its own.
  storybook:
    image: moneta:deps
    build: { <<: *build, target: deps }
    init: true
    command: pnpm exec storybook dev --host 0.0.0.0 --port ${STORYBOOK_PORT} --ci
    ports:
      - ${STORYBOOK_PORT:?set in infra/settings.env}:${STORYBOOK_PORT}
    volumes:
      - ..:/app:ro
      - /app/node_modules

  # Installs the dependencies into the machine's node_modules and the lockfile.
  install:
    image: moneta:base
    build: { <<: *build, target: base }
    volumes:
      - ..:/app
      - pnpm-store:/pnpm-store

volumes:
  pnpm-store:
